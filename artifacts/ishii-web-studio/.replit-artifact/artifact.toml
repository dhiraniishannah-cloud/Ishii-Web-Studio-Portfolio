kind = "web"
previewPath = "/"
title = "Ishii Web Studio Portfolio"
description = "A polished portfolio website for Ishii Web Studio, showcasing five clearly labeled website concepts and helping small businesses get in touch by WhatsApp or email."
version = "1.0.0"
id = "artifacts/ishii-web-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21856

[services.development]
run = "pnpm --filter @workspace/ishii-web-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ishii-web-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ishii-web-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21856"
BASE_PATH = "/"
